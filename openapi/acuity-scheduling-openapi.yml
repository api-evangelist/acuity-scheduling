openapi: 3.1.0
info:
  title: Acuity Scheduling API
  version: v1
  description: >-
    Acuity Scheduling's API for managing appointments, payments, and service
    metadata. Documented endpoints cover listing/creating/updating appointments,
    retrieving payments for an appointment, and exposing service metadata.
  contact:
    name: Acuity Scheduling Developers
    url: https://developers.acuityscheduling.com
servers:
  - url: https://acuityscheduling.com/api/v1
    description: Acuity Scheduling API
tags:
  - name: Appointments
  - name: Payments
  - name: Meta
paths:
  /appointments:
    get:
      summary: Get a list of appointments currently scheduled for the authenticated user
      tags: [Appointments]
    post:
      summary: Create an appointment
      tags: [Appointments]
  /appointments/{id}:
    put:
      summary: Update appointment details from a whitelist of updatable attributes
      tags: [Appointments]
  /appointments/{id}/payments:
    get:
      summary: Retrieve a list of payment transactions for a particular appointment
      tags: [Payments]
  /meta:
    get:
      summary: Get metadata for Acuity services
      tags: [Meta]
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth using your User ID as username and API Key as password
security:
  - BasicAuth: []
